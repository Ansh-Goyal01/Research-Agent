[pytest]
# Run the suite with a plain `python -m pytest`. No env var required.
#
# This project shares a global Python with unrelated projects, so pytest
# autoloads their `pytest11` entry points at startup. One of them (langsmith)
# imports a native extension that a machine-level Application Control policy
# has blocked, which aborts collection before a single test runs -- with a
# traceback that points at project code and is entirely unrelated to it.
#
# `-p no:<name>` is applied before autoload imports the plugin, so a plugin
# whose import crashes is never imported at all. None of these three are used
# by this suite; disabling them keeps the run independent of whatever else is
# pip-installed into the global site-packages later.
addopts =
    -p no:langsmith_plugin
    -p no:anyio
    -p no:dash

testpaths = tests

# The verification spine is imported as top-level packages (verification/,
# harness/) from the repo root, so the root must be on sys.path.
pythonpath = .
